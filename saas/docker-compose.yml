services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saas_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saas_dev_password}
      POSTGRES_DB: saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saas_app -d saas']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://saas_app:${POSTGRES_PASSWORD:-saas_dev_password}@postgres:5432/saas
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-http://localhost:8080}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  postgres_data:

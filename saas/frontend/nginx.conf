# Mirrors vite.config.js's dev-server proxy rules (same three paths) so
# the same frontend code works unmodified against the real backend
# container in production. NOT build/run-tested in this sandbox (no
# `docker` binary available) — verify before relying on it in production.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Client-side routing (react-router BrowserRouter) — any path that
    # isn't a real static file or one of the proxied prefixes above falls
    # back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
